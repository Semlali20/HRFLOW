# ─── Nginx configuration for Angular 16 SPA + Spring Boot reverse proxy ──────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options   "nosniff"                             always;
    add_header X-XSS-Protection         "1; mode=block"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy       "geolocation=(), microphone=()"       always;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/x-javascript
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ── Upload size ───────────────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # ── Proxy timeouts (shared) ───────────────────────────────────────────────
    proxy_connect_timeout   60s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;

    # ── SSE: Server-Sent Events — must NOT be buffered ────────────────────────
    # EventSource reconnects every 5 s if the connection drops; Nginx must
    # forward the chunked stream immediately without buffering.
    location /api/v1/notifications/stream {
        proxy_pass         http://backend:8090;
        proxy_http_version 1.1;

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        # Keep the TCP connection alive for the long-lived SSE stream
        proxy_set_header   Connection         "";

        proxy_buffering              off;
        proxy_cache                  off;
        proxy_read_timeout           3600s;
        proxy_send_timeout           3600s;
        chunked_transfer_encoding    on;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8090;
        proxy_http_version 1.1;

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         "";

        proxy_buffer_size        16k;
        proxy_buffers            8 32k;
        proxy_busy_buffers_size  64k;

        # Pass through large response headers (JWT tokens, etc.)
        proxy_pass_header  Authorization;

        # Hide upstream internal headers
        proxy_hide_header  X-Powered-By;
    }

    # ── Swagger UI (Spring Boot) ──────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass         http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass         http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Angular hashed static assets: cache 1 year (immutable) ───────────────
    # Angular CLI appends a content hash to every JS/CSS bundle filename, so
    # these files are safe to cache indefinitely in the browser.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Other static assets ───────────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Angular SPA catch-all ─────────────────────────────────────────────────
    # Any URL that does not match a static file must be served as index.html so
    # the Angular router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;
}

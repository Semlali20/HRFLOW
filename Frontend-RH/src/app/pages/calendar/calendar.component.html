<div class="container-fluid">
  <app-loader></app-loader>

  <app-page-title title="Calendrier" [breadcrumbItems]="breadCrumbItems"></app-page-title>
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div class="app-calendar">
            <!-- FullCalendar component -->
            <full-calendar #fullCalendar [options]="calendarOptions"></full-calendar>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Show Event Details MODAL -->
<ng-template #showEventModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="modal-title">Event Details</h5>
    <button type="button" class="btn-close" (click)="modalRef?.hide()"></button>
  </div>
  <div class="modal-body p-4">
    <div class="row">
      <div class="col-12">
        <div class="mb-3">
          <label class="control-label">Event Name</label>
          <p>{{ eventDetails.title }}</p>
        </div>
      </div>
      <div *ngIf="eventDetails.message" class="col-12">
        <div class="mb-3">
          <label class="control-label">Message</label>
          <p>{{ eventDetails.message }}</p>
        </div>
      </div>
      <div *ngIf="eventDetails.done !== undefined" class="col-12">
        <div class="mb-3">
          <label class="control-label">Status</label>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="doneSwitch" [(ngModel)]="eventDetails.done" (change)="toggleDone()">
            <label class="form-check-label" for="doneSwitch">Done</label>
          </div>
        </div>
      </div>
    </div>
    <div class="text-end mt-2">
      <button type="button" class="btn btn-light" (click)="modalRef?.hide()">Close</button>
    </div>
  </div>
</ng-template>

<div class="notif-page">
  <div class="notif-header">
    <h4 class="notif-title">Notification</h4>
    <div class="notif-header-right">
      <button class="mark-all-btn" (click)="markAllRead()">Mark all as read</button>
    </div>
  </div>

  <div class="notif-card">
    <div class="notif-tabs-bar">
      <button class="notif-tab" [class.active]="activeTab==='employee'" (click)="activeTab='employee'">
        Employee
        <span class="tab-count" *ngIf="activeTab!=='employee'">{{ employeeNotifs.length }}</span>
      </button>
      <button class="notif-tab" [class.active]="activeTab==='hr'" (click)="activeTab='hr'">
        Human Resource
        <span class="tab-count" *ngIf="activeTab!=='hr'">{{ hrNotifs.length }}</span>
      </button>
    </div>

    <div class="notif-list">
      <div *ngFor="let n of activeNotifs" class="notif-item" [class.unread]="!n.read">
        <div class="notif-dot" *ngIf="!n.read"></div>
        <div class="notif-icon-box" [style.background]="n.iconBg">
          <i class="bx" [ngClass]="n.icon" [style.color]="n.iconColor"></i>
        </div>
        <div class="notif-body">
          <div class="notif-msg-title">{{ n.title }}</div>
          <div class="notif-msg-sub">{{ n.message }}</div>
        </div>
        <div class="notif-time">{{ n.time }}</div>
      </div>
    </div>
  </div>
</div>

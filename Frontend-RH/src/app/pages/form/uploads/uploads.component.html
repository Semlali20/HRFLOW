<div class="container-fluid">
  <app-page-title title="Form File Upload" [breadcrumbItems]="breadCrumbItems"></app-page-title>
  <app-loader></app-loader>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div class="card-title">Excel import</div>
          <p class="card-title-desc">Import File excel or CSV.</p>
          <div>
            <form>
              <ngx-dropzone (change)="onSelect($event)" [accept]="'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv'">
                <ngx-dropzone-label class="dz-message needsclick">
                  <div class="mb-3">
                    <i class="display-4 text-muted bx bxs-cloud-upload"></i>
                  </div>
                  <h5>Drop Excel or CSV files here or click to upload.</h5>
                </ngx-dropzone-label>
              </ngx-dropzone>
              <ngx-dropzone-preview *ngIf="files.length > 0" class="border rounded" [removable]="true" (removed)="onRemove($event)">
                <ngx-dropzone-label>
                  <div class="d-flex p-2">
                    <div class="flex-shrink-0 me-3">
                      <div class="avatar-sm bg-light rounded">
                        <i class="bx bx-file display-4 text-primary"></i>
                      </div>
                    </div>
                    <div class="flex-grow-1">
                      <div class="pt-1">
                        <strong>{{ files[0]?.name }}</strong>
                      </div>
                    </div>
                  </div>
                </ngx-dropzone-label>
              </ngx-dropzone-preview>
            </form>
          </div>
          <div class="text-center mt-4">
            <button type="button" class="btn btn-primary" (click)="onUpload()">Send Files</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

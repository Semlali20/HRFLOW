<div class="fm-page">

  <!-- Page Header -->
  <div class="page-header">
    <div class="ph-left">
      <h4 class="page-title">File Manager</h4>
    </div>
    <div class="ph-right">
      <span class="ph-meta"><i class="bx bx-calendar"></i> {{ today | date:'EEEE, MMMM d, y' }}</span>
      <span class="ph-divider"></span>
      <span class="ph-meta"><i class="bx bx-globe"></i> English <i class="bx bx-chevron-down"></i></span>
    </div>
  </div>

  <!-- Layout -->
  <div class="fm-layout">

    <!-- Sidebar -->
    <div class="fm-sidebar">
      <a href="/UploadsCv" class="btn-upload"><i class="bx bx-upload"></i> Upload File</a>
      <button class="btn-delete-all" (click)="deleteAllFiles()"><i class="bx bx-trash"></i> Delete All</button>


<div class="fm-nav">
        <div class="fm-nav-item active"><i class="bx bx-folder"></i> My CV's</div>
        <div class="fm-nav-item"><i class="bx bx-file"></i> Documents</div>
        <div class="fm-nav-item"><i class="bx bx-trash-alt"></i> Trash</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="fm-main">

      <!-- Loading overlay -->
      <div *ngIf="isLoading" class="loading-overlay">
        <div class="loading-spinner"></div>
      </div>

      <!-- Toolbar -->
      <div class="fm-toolbar">
        <h5 class="fm-title">My CV's</h5>
        <div class="fm-toolbar-right">
          <div class="search-wrap">
            <i class="bx bx-search"></i>
            <input type="text" placeholder="Search files..." [(ngModel)]="searchKeyword"
              (keyup)="searchFiles()" name="searchKeyword">
          </div>
          <button class="btn-icon" title="More options"><i class="bx bx-dots-vertical-rounded"></i></button>
        </div>
      </div>

      <!-- Table -->
      <div class="fm-table-wrap">
        <table class="fm-table">
          <thead>
            <tr>
              <th>NAME</th>
              <th>DATE MODIFIED</th>
              <th>SIZE</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let file of files" (dblclick)="openFile(file.name)">
              <td>
                <div class="file-name">
                  <div class="file-icon">
                    <i [class]="getFileIcon(file.name)"></i>
                  </div>
                  <span>{{ file.name }}</span>
                </div>
              </td>
              <td class="td-muted">{{ file.dateModified }}</td>
              <td class="td-muted">{{ file.size }}</td>
              <td>
                <div class="row-actions">
                  <button class="act-btn" (click)="openFile(file.name)" title="Open"><i class="bx bx-show"></i></button>
                  <button class="act-btn act-btn--del" (click)="deleteFile(file.name)" title="Delete"><i class="bx bx-trash"></i></button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Empty state -->
        <div *ngIf="!isLoading && files.length === 0" class="empty-state">
          <i class="bx bx-folder-open"></i>
          <p>No files found</p>
          <span>Upload a file to get started</span>
        </div>
      </div>

    </div>
  </div>
</div>

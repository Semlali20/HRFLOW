<div id="preloader" *ngIf="visible" [class.pl--fading]="fading">
  <div class="pl-card">

    <!-- Spinning ring with letter inside -->
    <div class="pl-ring">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="28" stroke="#E8EDF2" stroke-width="3.5"/>
        <circle cx="32" cy="32" r="28" stroke="#2FA8A0" stroke-width="3.5"
                stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="44"
                class="pl-arc"/>
      </svg>
      <div class="pl-ring-center">W</div>
    </div>

    <!-- Brand name -->
    <div class="pl-brand">WIKO <span>HR</span></div>

    <!-- Animated progress bar -->
    <div class="pl-track">
      <div class="pl-fill"></div>
    </div>

  </div>
</div>

<div class="wiko-auth">
  <!-- Left: Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <div class="auth-logo">
        <span class="logo-icon"><i class="bx bxs-cube-alt"></i></span>
        <span class="logo-text">WIKO<span>HR</span></span>
      </div>

      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Sign in to your HR dashboard</p>

      <div class="auth-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrap">
            <i class="bx bx-envelope input-icon"></i>
            <input
              type="email"
              class="form-input"
              [(ngModel)]="email"
              name="email"
              placeholder="you@company.com">
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label">Password</label>
          </div>
          <div class="input-wrap">
            <i class="bx bx-lock-alt input-icon"></i>
            <input
              [type]="showPwd ? 'text' : 'password'"
              class="form-input"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••">
            <button type="button" class="eye-btn" (click)="showPwd=!showPwd">
              <i class="bx" [ngClass]="showPwd ? 'bx-hide' : 'bx-show'"></i>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
            <span>Remember me</span>
          </label>
        </div>

        <button type="button" class="btn-signin" (click)="login()">
          Sign In <i class="bx bx-right-arrow-alt"></i>
        </button>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="/account/auth/signup" class="auth-link">Create one</a>
      </p>
    </div>
  </div>

  <!-- Right: Hero Panel -->
  <div class="auth-hero-panel">
    <div class="deco deco-1"></div>
    <div class="deco deco-2"></div>
    <div class="deco deco-3"></div>
  </div>
</div>

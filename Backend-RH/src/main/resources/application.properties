spring.application.name=GestionRH

# ── Database ─────────────────────────────────────────────────────────────────
# All credentials are resolved from environment variables — never hardcode here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_rhmanager}
# Fallback to 'postgres' when the env var is absent (local dev only).
# In production always set SPRING_DATASOURCE_USERNAME / _PASSWORD as real env vars.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8090}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain

# ── JWT ──────────────────────────────────────────────────────────────────────
# Minimum 256-bit (32-char) secret — must be set via environment variable
innovx.app.jwtSecret=${INNOVX_APP_JWTSECRET:local-dev-jwt-secret-min-32-chars-ok!!}
# Access token TTL: 15 minutes (900 000 ms)
innovx.app.jwtExpirationMs=${INNOVX_APP_JWTEXPIRATIONMS:900000}
# Refresh token TTL: 7 days (604 800 000 ms)
innovx.app.jwtRefreshExpirationMs=${INNOVX_APP_JWTREFRESHEXPIRATIONMS:604800000}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── SMTP ─────────────────────────────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@localhost}
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy-local-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── File Storage ─────────────────────────────────────────────────────────────
app.file.upload-dir=${FILE_UPLOAD_PATH:./uploads}
app.file.cv-dir=${FILE_CV_PATH:./uploads/cv}
app.file.stored-cvs-dir=${FILE_STORED_CVS:./stored-cvs}
# Maximum allowed file size: 10 MB
app.file.max-size=${FILE_MAX_SIZE:10485760}

# ── Pagination defaults ───────────────────────────────────────────────────────
app.pagination.default-page-size=${PAGINATION_PAGE_SIZE:20}
app.pagination.max-page-size=${PAGINATION_MAX_SIZE:100}

# ── Spring Cache (simple in-memory by default; swap to Redis later) ──────────
spring.cache.type=simple

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=HRFLOW
info.app.version=2.0.0
info.app.organization=INNOVX

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.innovx.gestionrh=${APP_LOG_LEVEL:INFO}
# Enable SQL debug only when explicitly requested — never in production
logging.level.org.hibernate.SQL=${HIBERNATE_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ── Multipart / file upload ──────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── OpenAPI / Swagger UI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false
